name: Windows Desktop Build
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      - run: npm install
      - run: npm run dist:win
      - name: Verify EXE and report size
        shell: pwsh
        run: |
          $f = Get-ChildItem release -Filter '*.exe' | Select-Object -First 1
          if (-not $f) { throw 'No EXE installer produced' }
          "Installer $($f.Name): $([math]::Round($f.Length / 1MB, 2)) MB" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($f.Length -lt 50MB) { Write-Warning 'Below approximate 180MB target; actual size depends on assets/runtime.' }
      - uses: actions/upload-artifact@v4
        with: {name: navaris-windows-installer, path: release/*.exe, if-no-files-found: error, retention-days: 14}
