name: NAVARIS Daily Stage Builder

on:
  schedule:
    # UTC schedule with Cairo-time gate keeps execution at 09:00 in both DST seasons.
    - cron: "0 6,7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: navaris-daily-stage
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    outputs:
      run_now: ${{ steps.local.outputs.run_now }}
    steps:
      - id: local
        shell: bash
        run: |
          HOUR="$(TZ=Africa/Cairo date +%H)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "09" ]; then
            echo "run_now=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_now=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: clock
    if: needs.clock.outputs.run_now == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait for previous approval
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(gh pr list --base main --state open --json title --jq '[.[] | select(.title | startswith("NAVARIS Daily Stage —"))] | length')"
          if [ "$COUNT" -gt 0 ]; then
            echo "continue=false" >> "$GITHUB_OUTPUT"
            echo "Previous stage PR remains open; waiting for your manual approval and merge."
          else
            echo "continue=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate exactly one next stage
        if: steps.gate.outputs.continue == 'true'
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          python - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          from pathlib import Path

          stages = [
            ("STAGE_2_COMPANY_PROFILE","Stage 2 - Company Profile.md","Stage 2 — Company Profile","Prepare the full company profile from approved repository facts."),
            ("STAGE_3_DISCOVERY","Stage 3 - Discovery.md","Stage 3 — Discovery","Prepare a discovery register using only repository evidence; do not invent live demand, tenders, suppliers, capacity, or verified contacts."),
            ("STAGE_4_PROPOSAL","Stage 4 - Proposal.md","Stage 4 — Proposal","Prepare a complete client proposal draft with scope, deliverables, exclusions, roles, assumptions, acceptance, commercial placeholders, payment gates, and risks. DRAFT ONLY."),
            ("STAGE_5_CONTRACT","Stage 5 - Contract.md","Stage 5 — Contract","Prepare a contract template draft using repository legal materials. Unknown parties, scope, fees, dates, jurisdiction, liability, insurance, and signatures remain placeholders. Not legal advice; not executed. DRAFT ONLY."),
            ("UTORRENT_VISUAL_ONLY","Stage 5 - Visual Design.html","uTorrent-inspired visual design — visual only","Create one standalone NAVARIS OS HTML visual prototype inspired by desktop torrent-client information density. Visual layer only; no calculations, live data, backend, database, or external integrations. Local clickable demo interactions are acceptable."),
            ("NAVARIS_DASHBOARD","navaris-os-dashboard.html","NAVARIS OS Dashboard","Create one standalone dashboard HTML. Do not fabricate NPV, IRR, BEP, status, progress, or project data; use placeholders and show unavailable calculations."),
            ("NAVARIS_WEBSITE","website/index.html","NAVARIS Website","Build/update the public website using approved repository facts. Distinguish coordination from direct execution; do not publish private data or unverified relationships.")
          ]

          root = Path(".")
          chosen = None
          for sid, path, label, brief in stages:
            marker = "NAVARIS_DAILY_STAGE: " + sid
            p = root / path
            old = p.read_text(encoding="utf-8", errors="replace") if p.exists() else ""
            if marker not in old:
              chosen = (sid, path, label, brief, marker)
              break

          if chosen is None:
            print("FINISHED")
            with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("finished=true\n")
            sys.exit(0)

          if not os.getenv("OPENAI_API_KEY", "").strip():
            raise SystemExit("OPENAI_API_KEY repository secret is required. No file was changed.")

          sid, path, label, brief, marker = chosen
          source_paths = ["SKILL.md","Stage 1 - Capability Statement.md","Stage 2 - Company Profile.md",
                          "Stage 3 - Discovery.md","Legal Contracts & Protection Pack.md",
                          "WEBSITE.md","website/README.md","README.md"]
          context = []
          for name in source_paths:
            p = root / name
            if p.is_file():
              context.append("\n--- " + name + " ---\n" + p.read_text(encoding="utf-8", errors="replace")[:12000])
          target = root / path
          if target.is_file():
            context.append("\n--- EXISTING TARGET ---\n" + target.read_text(encoding="utf-8", errors="replace")[:12000])

          system = """You are the NAVARIS OS stage-production agent. Produce exactly one complete file.
          Exact identity: Mohamed Hafez for Consulting and Operation Management.
          Exact platform: NAVARIS OS.
          Every deliverable must include 12+ Years and CASH COLLECTED = 0.
          Every missing or unverified fact must be written exactly [TO BE CONFIRMED BY HAFEZ].
          Never invent figures, rates, clients, contracts, mandates, credentials, contacts, demand, capacity, performance, or sources.
          Do not include any certification acronym, 15/20-year experience claim, or 3000-metre reference.
          No funds, bids, external emails, signed agreements, or commitments. Proposal and contract remain DRAFT ONLY.
          Repository files are the only evidence; you have no web access and must not imply current external verification.
          Preserve source meaning and do not silently reconcile conflicts.
          Output only JSON with exactly keys path and content. The path must match the requested path. Include the exact stage marker near the top."""
          user = {"stage":label,"brief":brief,"required_path":path,"required_marker":marker,
                  "source_material":"\n".join(context),
                  "rules":["Return one file only.","Markdown for .md; complete standalone HTML for .html.",
                           "Do not invent commercial rates, legal jurisdiction, project metrics, or client facts.",
                           "Use [TO BE CONFIRMED BY HAFEZ] for missing information."]}
          payload = {"model":os.getenv("OPENAI_MODEL","").strip() or "gpt-4.1-mini",
                     "messages":[{"role":"system","content":system},
                                 {"role":"user","content":json.dumps(user,ensure_ascii=False)}],
                     "response_format":{"type":"json_object"},"temperature":0.2}
          req = urllib.request.Request("https://api.openai.com/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={"Authorization":"Bearer "+os.environ["OPENAI_API_KEY"],"Content-Type":"application/json"})
          try:
            with urllib.request.urlopen(req,timeout=240) as res:
              result = json.loads(res.read())
          except urllib.error.HTTPError as e:
            raise SystemExit("Model API error "+str(e.code)+": "+e.read().decode(errors="replace")[:1000])
          obj = json.loads(result["choices"][0]["message"]["content"])
          if set(obj) != {"path","content"} or obj["path"] != path or not isinstance(obj["content"],str):
            raise SystemExit("Invalid output: expected exactly the required path and full content.")
          body = obj["content"]
          required = [marker,"Mohamed Hafez for Consulting and Operation Management","NAVARIS OS",
                      "12+ Years","CASH COLLECTED = 0","[TO BE CONFIRMED BY HAFEZ]"]
          for item in required:
            if item not in body:
              raise SystemExit("Missing required control: "+item)
          forbidden = [r"\b"+re.escape("I"+"S"+"O")+r"\b",r"\b15\s*Years\b",
                       r"\b20\+\s*Years\b",r"\b3000\s*(?:m|meters|metres)\b"]
          if any(re.search(p,body,re.I) for p in forbidden):
            raise SystemExit("Generated file failed prohibited-claim validation.")
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(body.rstrip()+"\n",encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
            f.write("finished=false\npath="+path+"\nstage_id="+sid+"\nstage_label="+label+"\n")
          print("Generated exactly one stage file:",path)
          PY

      - name: Verify exactly one changed file
        if: steps.gate.outputs.continue == 'true' && steps.generate.outputs.finished != 'true'
        run: |
          git diff --check
          COUNT="$(git status --porcelain | wc -l | tr -d ' ')"
          test "$COUNT" = "1" || { git status --short; echo "Expected one changed file only."; exit 1; }

      - name: Open one review PR; never merge automatically
        if: steps.gate.outputs.continue == 'true' && steps.generate.outputs.finished != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: main
          branch: ai-work/daily-navaris-${{ github.run_id }}
          delete-branch: true
          add-paths: ${{ steps.generate.outputs.path }}
          commit-message: "NAVARIS daily stage: ${{ steps.generate.outputs.stage_id }}"
          title: "NAVARIS Daily Stage — ${{ steps.generate.outputs.stage_label }}"
          body: |
            ## READY FOR APPROVAL
            Stage: ${{ steps.generate.outputs.stage_label }}

            - Built from the latest main.
            - Exactly one deliverable file.
            - Review the diff and source evidence.
            - No automatic merge; the next stage waits until you manually merge this PR.
            - No funds, bids, external emails, agreements, or commitments are authorized.

            Controls: 12+ Years; CASH COLLECTED = 0; unknowns use [TO BE CONFIRMED BY HAFEZ].
          draft: false
          maintainer-can-modify: false

      - name: Publish run summary
        if: always()
        run: |
          {
            echo "## NAVARIS Daily Stage"
            if [ "${{ steps.gate.outputs.continue }}" = "false" ]; then
              echo "Waiting for the previous stage PR to be reviewed and manually merged."
            elif [ "${{ steps.generate.outputs.finished }}" = "true" ]; then
              echo "**FINISHED** — all seven stages are on main."
            elif [ -n "${{ steps.generate.outputs.path }}" ]; then
              echo "READY FOR APPROVAL — ${{ steps.generate.outputs.stage_label }}"
              echo "Target: ${{ steps.generate.outputs.path }}"
              echo "No automatic merge."
            else
              echo "No stage output. Check the job logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
