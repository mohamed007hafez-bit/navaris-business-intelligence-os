          Path("docs/STRATEGY_CASH_FIRST.md").write_text("""# NAVARIS CASH-FIRST STRATEGY

## Operating Objective
TARGET -> CASH 1ST -> FLOW

KPI: CASH COLLECTED

Core function:
FIND -> ANALYZE -> QUALIFY -> STRUCTURE -> EXECUTE -> COLLECT -> REPEAT

## Mandatory Target Gate
A target is actionable only when:
1. Real demand/problem is evidenced.
2. Buyer/counterpart is identifiable.
3. Commercial value/budget is credible; priority to USD or USD-linked cash.
4. NAVARIS has a defined role: Sourcing, Diagnostic, Commercial Representation, Tender Readiness, Deal Support, or Turnaround.
5. A supplier/partner is identifiable or can be qualified.
6. Agreement-first status is preserved before any external commercial commitment.

## Evidence Chain
FACT -> SOURCE -> CALCULATION -> ASSUMPTION -> INTERPRETATION -> ACTION

Never present inference as fact. Every material opportunity needs an evidence link.

## Agreement-First Rule
Default status:
AGREEMENT REQUIRED FIRST

No quotation, purchase commitment, representation commitment, external outreach, or commercial acceptance is authorized without the Human Gate.

## Daily Cash Engine
The single active workflow reviews:
- verified demand and tenders;
- supplier/OEM fit;
- days-to-cash and expected USD cash;
- qualification gaps;
- agreement status;
- one highest-value next action.

No email is sent automatically.
No external commitment is made automatically.

## Priority
P0/P1 opportunities with:
- immediate or near-term cash;
- hard-to-source supply;
- identifiable buyer;
- credible budget;
- short execution path.

Reject or defer low-value, EGP-only, vague, or unverified opportunities.
""", encoding="utf-8")
          Path("skills/navaris-cash-engine/SKILL.md").write_text("""# NAVARIS CASH ENGINE SKILL

## Purpose
Operate NAVARIS as a cash-first business intelligence and deal-orchestration layer.

## Required workflow
1. FIND evidence-backed demand.
2. ANALYZE the commercial/operational problem.
3. QUALIFY buyer, budget, geography, currency, urgency and supplier fit.
4. STRUCTURE the NAVARIS role and three-party route where applicable.
5. EXECUTE only after Human Gate and required agreement.
6. COLLECT and record actual cash.
7. REPEAT using learning from completed deals.

## Hard Rules
- TARGET -> CASH 1ST -> FLOW.
- KPI = CASH COLLECTED.
- Agreement-first.
- Evidence trail = FACT -> SOURCE -> CALCULATION -> ASSUMPTION -> INTERPRETATION -> ACTION.
- USD or USD-linked cash is preferred; reject EGP-only low-value work.
- No automatic email sending.
- No external commercial commitment without Human Gate.
- Keep Demand + NAVARIS Introduced Service + Supplier together in one opportunity row.
- Agreement_Status must remain AGREEMENT REQUIRED FIRST until explicitly changed by an authorized human.

## Output
For each qualified opportunity capture:
Demand | NAVARIS Introduced Service | Supplier | Evidence Link | Agreement_Status | Expected Cash | Next Action

## Quality Control
Flag:
- missing source;
- unverified buyer;
- unclear budget;
- unclear supplier capability;
- missing agreement;
- unsupported cash estimate.

Do not convert an inference into FACT.
""", encoding="utf-8")
          Path(".github/workflows/navaris-cash-flow-engine.yml").write_text("""name: NAVARIS CASH FLOW ENGINE

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cash-flow-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Excel dependency
        run: pip install openpyxl
      - name: Run NAVARIS cash-first control
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          p = Path("data/NAVARIS_3Part_AgreementFirst_OS.xlsx")
          if not p.exists():
              raise SystemExit("Required NAVARIS workbook is missing")
          wb = load_workbook(p)
          ws = wb["MASTER_3Part_Agreement_First"]
          # Agreement-first invariant: do not allow accidental commercial authorization.
          headers = {c.value:i+1 for i,c in enumerate(ws[1])}
          if "Agreement_Status" in headers:
              col = headers["Agreement_Status"]
              for r in range(2, ws.max_row + 1):
                  if any(ws.cell(r,c).value for c in range(1, ws.max_column + 1)):
                      ws.cell(r,col).value = "AGREEMENT REQUIRED FIRST"
          wb.save(p)
          print(f"NAVARIS CASH FLOW ENGINE verified {ws.max_row-1} opportunity rows.")
          PY
      - name: Commit engine updates
        run: |
          git config user.name "navaris-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/NAVARIS_3Part_AgreementFirst_OS.xlsx docs/STRATEGY_CASH_FIRST.md skills/navaris-cash-engine/SKILL.md .github/workflows/navaris-cash-flow-engine.yml
          git diff --cached --quiet || git commit -m "NAVARIS CASH FLOW ENGINE scheduled update"
          git push
""", encoding="utf-8")
          PY
          rm -f .github/workflows/navaris-daily.yml .github/workflows/navaris-build-cash-first-excel.yml .github/workflows/navaris-one-time-workbook-update.yml .github/workflows/_navaris_one_schedule_migration.yml
      - name: Commit final one-schedule state
        run: |
          git config user.name "navaris-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Implement ONE SCHEDULE ONLY - NAVARIS CASH FLOW ENGINE"
          git push
