name: NAVARIS one-time workbook update
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/navaris_one_time_xlsx_update.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update workbook
        run: |
          python -m pip install openpyxl
          python - <<'PY'
          from openpyxl import load_workbook
          p = "data/NAVARIS_3Part_AgreementFirst_OS.xlsx"
          wb = load_workbook(p)
          ws = wb["MASTER_3Part_Agreement_First"]
          rows = [
            ["EGPC","Procurement / sourcing demand across petroleum operations; FACT: EGPC mission includes developing oil business and diversifying petroleum products and services.","Sourcing / Rep","INTERSHIP","Egypt – Cairo / Alexandria / Ports","FACT","EGPC official: https://www.egpc.com.eg/","AGREEMENT REQUIRED FIRST"],
            ["EGPC","Petroleum-sector technical/supply demand; FACT: EGPC states it develops oil business and meets local/global market service needs.","Diagnostic / Sourcing","EU OEM (to be qualified)","Egypt – National petroleum sector","FACT","EGPC official: https://www.egpc.com.eg/","AGREEMENT REQUIRED FIRST"],
            ["EGAS","Gas-sector supplier and project demand; FACT: EGAS publishes supplier registration guides and business opportunities and manages gas exploration, production, processing, transport and infrastructure.","Sourcing / Rep","INTERSHIP","Egypt – Cairo / Gas facilities","FACT","EGAS official: https://www.egas.com.eg/web/egas","AGREEMENT REQUIRED FIRST"],
            ["EGAS","Gas infrastructure / project optimization demand; FACT: EGAS mission includes project management, cost optimization, facility utilization and new specialized companies.","Diagnostic / Sourcing","EU OEM (to be qualified)","Egypt – Cairo / National gas network","FACT","EGAS official: https://www.egas.com.eg/es/establishing_egas","AGREEMENT REQUIRED FIRST"],
            ["EDC","Drilling and workover operational-support demand; FACT: EDC is a leading drilling contractor with offshore/onshore drilling and workover activities and about 70 rigs.","Sourcing / Rep","Link Marine S.A.E","Egypt – Offshore / Onshore","FACT","MOC EDC profile: https://moc-egypt.com/company/egyptian-drilling-company/ | ACS Link Marine: https://www.acs.org.eg/members/","AGREEMENT REQUIRED FIRST"],
            ["EDC","Drilling technology / equipment sourcing demand; FACT: EDC operates offshore and onshore drilling and workover services.","Diagnostic / Sourcing","EU OEM (to be qualified)","Egypt – Oil & Gas","FACT","MOC EDC profile: https://moc-egypt.com/company/egyptian-drilling-company/","AGREEMENT REQUIRED FIRST"],
            ["ECMR – Egyptian Company for Mineral Resources","Mining production, technology and investment demand; FACT: ECMR manages mineral resources and targets exploration, production, added value and investment partnerships.","Diagnostic / Rep","Inchcape Shipping Services Egypt","Egypt – Cairo / Eastern Desert / Ports","FACT","ECMR 2026 profile/report: https://egyptoil-gas.com/news/ecmr-reports-39-rise-in-revenues-in-fy-2024-2025/ | ACS Inchcape: https://www.acs.org.eg/members/inchcape-shipping-services/","AGREEMENT REQUIRED FIRST"],
            ["Suez Canal Authority","Marine repair, salvage, shipyard, tendering and marine-service demand; FACT: SCA lists ship repair, salvage, shipyard services and tendering among its services.","Sourcing / Rep","INTERSHIP","Egypt – Suez Canal / Ismailia / Ports","FACT","SCA official services: https://www.suezcanal.gov.eg/English/Pages/default.aspx","AGREEMENT REQUIRED FIRST"],
            ["Suez Canal Authority","Marine equipment / fleet support demand; FACT: SCA operates and maintains the Canal and a fleet of tugs, boats and other marine units, with supplier e-tendering.","Diagnostic / Sourcing","Inchcape Shipping Services Egypt","Egypt – Suez Canal / Ismailia","FACT","SCA Marine Products: https://www.suezcanal.gov.eg/English/MarineProducts/Pages/default.aspx | SCA Registration: https://www.suezcanal.gov.eg/English/Pages/RegistrationTutorial.aspx","AGREEMENT REQUIRED FIRST"],
            ["B&G Shipping Agencies – Alexandria","Marine agency / port-services sourcing demand; FACT: B&G is an Alexandria Chamber member with Alexandria head office and Cairo/Suez branches.","Sourcing / Rep","EU OEM (to be qualified)","Egypt – Alexandria / Suez","FACT","Alexandria Chamber B&G profile: https://www.acs.org.eg/members/bg-shipping-agencies-2/","AGREEMENT REQUIRED FIRST"],
          ]
          for r in rows:
              ws.append(r)
              ws.cell(ws.max_row, 8).value = "AGREEMENT REQUIRED FIRST"
          wb.save(p)
          print("updated rows:", len(rows), "new max row:", ws.max_row)
          PY
      - name: Commit workbook and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/NAVARIS_3Part_AgreementFirst_OS.xlsx
          git rm .github/workflows/navaris_one_time_xlsx_update.yml
          git commit -m "Update 3-part agreement-first demand supplier matrix"
          git push origin main
