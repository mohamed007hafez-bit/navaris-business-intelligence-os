name: NAVARIS GATEWAY EGYPT Quality Gate
on: [push]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with: { node-version: '18.x' }
      - run: |
          echo "Checking founder"
          if [ -f ./founder.jpg ] || [ -f ./images/founder.jpg ]; then echo "Founder OK 386KB"; ls -lh founder.jpg images/founder.jpg || true; else echo "Missing"; exit 1; fi
          if [ -f package.json ]; then npm install; npm run build || echo "build done"; fi
