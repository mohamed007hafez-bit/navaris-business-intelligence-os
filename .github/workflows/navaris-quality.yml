name: NAVARIS Quality Gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navaris-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate canonical website and core files
        run: |
          test -f index.html
          grep -F '<title>NAVARIS GATEWAY EGYPT</title>' index.html
          test -f agents/shipping.py
          test -f agents/oilfield.py
          test -f agents/financial.py
          test -f navaris_agents/commercial_controls.py
          test -f navaris_core_engine.py
          test -f NAVARIS_CORE_MASTER_LOG.md
          test -f docs/NAVARIS_MASTER_STRATEGY_EXECUTION_BLUEPRINT.md
          test -f docs/NAVARIS_CLAIM_EVIDENCE_REGISTER.md
      - name: Validate JSON sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [Path("package.json"), Path("data/cash-collected.json")]
          optional = [Path("agents.json"), Path("manifest.json")]
          for path in required + [p for p in optional if p.exists()]:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"JSON OK: {path}")
          PY
      - name: Compile Python modules
        run: python -m compileall -q agents navaris_agents navaris_core_engine.py scripts/github_sync.py
      - name: Test NAVARIS core engine formulas and cash gate
        run: python -m unittest discover -s tests -p 'test_navaris_core_engine.py' -v
      - name: Test secure GitHub sync path validation
        run: python -m unittest discover -s tests -p 'test_github_sync.py' -v
      - name: Run toolkit and commercial control tests
        run: |
          python -m unittest discover -s tests -p "test_navaris_agents.py" -v
          python -m unittest discover -s tests -p "test_commercial_controls.py" -v
      - name: Block hard-coded GitHub credential patterns
        shell: bash
        run: |
          set -eu
          if git grep -n -I -E 'gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}' -- .; then
            echo "::error::Credential-like GitHub token found in tracked text file."
            exit 1
          fi
          echo "No token-like GitHub credentials found in tracked files."
