name: NAVARIS Supervised Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navaris-supervised-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, test, and build local core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime and development dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate required project structure
        run: |
          test -f main.py
          test -f navaris_core_engine.py
          test -f cash_agent.py
          test -f navaris_agents/commercial_controls.py
          test -f docs/workflows/NAVARIS_MASTER_WORKFLOW.md
          test -f docs/PRODUCTION_READINESS_GATES.md
          test -d tests
          test -d toolkit
          test -d skills

      - name: Validate tracked JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path(".").rglob("*.json"))
          excluded = {".git", "node_modules", ".venv", "venv"}
          checked = 0
          for path in paths:
              if any(part in excluded for part in path.parts):
                  continue
              json.loads(path.read_text(encoding="utf-8"))
              checked += 1
              print(f"JSON OK: {path}")
          print(f"Validated {checked} JSON files.")
          PY

      - name: Compile Python source
        run: |
          python -m compileall -q agents navaris_agents automation backend core engines integrations mcp-server scripts skills toolkit tests
          python -m py_compile main.py navaris_core_engine.py cash_agent.py scout_agent.py pricer_agent.py ncnda_agent.py chatgpt_bridge.py suco_quote_workbook.py

      - name: Run complete automated test suite
        run: python -m pytest -q

      - name: Build illustrative demo workbook
        run: python main.py --demo --output output/NAVARIS_DEMO.xlsx

      - name: Verify workbook output and cash boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook

          path = Path("output/NAVARIS_DEMO.xlsx")
          assert path.is_file() and path.stat().st_size > 0, "Demo workbook missing or empty"
          workbook = load_workbook(path, data_only=False)
          required = {"Pricing_Grading", "Monthly_30pct", "Tenders_BCG"}
          missing = required.difference(workbook.sheetnames)
          assert not missing, f"Missing workbook sheets: {sorted(missing)}"
          assert len(workbook["Pricing_Grading"]._charts) >= 1, "Expected pricing chart"
          print("PASS: demo workbook, required sheets, and chart verified.")
          print("NOTICE: demo data are illustrative; they are not live sales or collected cash.")
          PY

      - name: Scan tracked text for common GitHub token patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E 'gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}' -- .; then
            echo "::error::Credential-like GitHub token found in tracked text."
            exit 1
          fi
          echo "No common GitHub token patterns found."

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NAVARIS supervised quality gate"
            echo "- Commit: ${{ github.sha }}"
            echo "- Runtime: Python 3.12"
            echo "- Scope: source compilation, JSON validation, automated tests, demo workbook build."
            echo "- No live market discovery, bank verification, client communication, tender submission, or deployment is performed."
            echo "- Forecasts are not cash collected. Cash remains zero until independently evidenced, reconciled, and human-approved."
            echo "- A successful CI run is not a production certification."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated demo workbook
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: navaris-demo-workbook
          path: output/NAVARIS_DEMO.xlsx
          if-no-files-found: error
          retention-days: 14
