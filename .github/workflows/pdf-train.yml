name: NAVARIS PDF Agent Training
on:
  push:
    paths:
      - 'agents/*/latest.pdf'
      - 'agents.json'
      - 'scripts/train_agents.py'
      - '.github/workflows/pdf-train.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: navaris-pdf-train
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF parser
        run: python -m pip install --upgrade pypdf
      - name: Process real PDFs only; OpenAI if configured, otherwise mock embeddings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EMBED_MODEL: ${{ vars.OPENAI_EMBED_MODEL }}
        run: python scripts/train_agents.py
      - name: Commit generated artifacts if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/*/system-prompt.md agents/_training/*.jsonl
          if git diff --cached --quiet; then echo "No generated artifacts; no real PDFs were supplied."; exit 0; fi
          git commit -m "chore: train isolated NAVARIS agents from supplied PDFs"
          git push origin HEAD:main
