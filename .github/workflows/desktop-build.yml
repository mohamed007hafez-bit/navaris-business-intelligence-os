name: Desktop Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html','desktop/**','package.json','agents/**']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with: {node-version: '18.x'}
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: {name: navaris-desktop-build, path: release/*.exe, if-no-files-found: error}
