name: NAVARIS GitHub Pages Deployment
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "founder.jpg"
      - "images/founder.jpg"
      - ".github/workflows/navaris-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare minimal public site
        run: |
          mkdir -p _site/images
          test -s index.html
          cp index.html _site/index.html
          if [ -s founder.jpg ]; then cp founder.jpg _site/founder.jpg; fi
          if [ -s images/founder.jpg ]; then cp images/founder.jpg _site/images/founder.jpg; fi
          test -s _site/index.html
          test "$(wc -c < _site/index.html)" -lt 10485760
          if grep -R "container://" _site; then echo "Forbidden container:// URI found"; exit 1; fi
          echo "Public artifact contents:"
          find _site -type f -printf '%p %s bytes\n'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
