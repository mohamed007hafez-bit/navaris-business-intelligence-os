name: NAVARIS Desktop Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'index.html'
      - '.github/workflows/navaris-desktop-build.yml'
permissions:
  contents: read
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows installer and portable EXE
        working-directory: desktop
        run: npm run dist:win
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NAVARIS-BI-OS-v0.3.0-Windows-x64
          path: |
            desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
