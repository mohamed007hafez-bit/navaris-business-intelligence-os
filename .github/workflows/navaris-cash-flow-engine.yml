name: NAVARIS Cash-First Integrity Engine

on:
  workflow_dispatch:
  schedule:
    # 00:00 Egypt time (UTC+3); GitHub Actions cron is UTC.
    - cron: "0 21 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - "skills/**"
      - "docs/**"
      - ".github/workflows/navaris-cash-flow-engine.yml"

permissions:
  contents: read

concurrency:
  group: navaris-cash-first-integrity
  cancel-in-progress: false

jobs:
  validate:
    name: Build and validate NAVARIS workbook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Build agreement-first operating workbook
        run: python scripts/build_agreement_first_os.py

      - name: Validate workbook structure and controls
        run: python scripts/validate_navaris_workbook.py

      - name: Validate commercial evidence and approval policy
        run: |
          grep -Fq 'ANALYSIS → EQUATION → EVALUATION' skills/navaris-cash-engine/SKILL.md
          grep -Fq 'COMMERCIAL OPPORTUNITY → DECISION PACKAGE' skills/navaris-cash-engine/SKILL.md
          grep -Fq 'NOT CALCULABLE' skills/navaris-cash-engine/SKILL.md
          grep -Fq 'NO QUALIFIED LIVE OPPORTUNITY FOUND' skills/navaris-cash-engine/SKILL.md
          grep -Fq 'SEND/DO NOT SEND' skills/navaris-cash-engine/SKILL.md

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NAVARIS Cash-First Integrity Run"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Scheduled local target: 00:00 Egypt time (UTC+3)"
            echo "- Scope: workbook build and structural validation only"
            echo "- This run does not discover live tenders, verify buyers/suppliers, calculate unprovided deal cash, or send messages."
            echo "- Actual cash collected remains evidence-based; no forecast is counted as collected cash."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive validated workbook
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: navaris-operating-workbook
          path: data/NAVARIS_3Part_AgreementFirst_OS.xlsx
          if-no-files-found: error
          retention-days: 14
