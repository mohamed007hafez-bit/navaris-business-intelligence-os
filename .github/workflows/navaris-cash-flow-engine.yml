name: NAVARIS Cash-First Integrity Engine

on:
  workflow_dispatch:
  schedule:
    # 00:00 Egypt time (UTC+3); GitHub Actions cron is UTC.
    - cron: "0 21 * * *"
  push:
    branches: [main]
    paths:
      - "skills/navaris-cash-engine/**"
      - ".github/workflows/navaris-cash-flow-engine.yml"

permissions:
  contents: read

concurrency:
  group: navaris-cash-first-integrity
  cancel-in-progress: false

jobs:
  validate:
    name: Test cash-first engine and build workbook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install local engine dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile and test fixed core
        run: |
          python -m py_compile navaris_core.py scout_agent.py pricer_agent.py ncnda_agent.py cash_agent.py chatgpt_bridge.py main.py
          python -m unittest discover -s tests -p "test_navaris_os.py" -v

      - name: Build local workbook
        run: python main.py --demo --output output/NAVARIS_Agnatics_OS_FINAL.xlsx

      - name: Validate cash-first policy and workbook
        run: |
          grep -Fq 'ANALYSIS → EQUATION → EVALUATION' skills/navaris-cash-engine/SKILL.md
          grep -Fq 'COMMERCIAL OPPORTUNITY → DECISION PACKAGE' skills/navaris-cash-engine/SKILL.md
          grep -Fq 'NOT CALCULABLE' skills/navaris-cash-engine/SKILL.md
          grep -Fq 'NO QUALIFIED LIVE OPPORTUNITY FOUND' skills/navaris-cash-engine/SKILL.md
          grep -Fq 'SEND/DO NOT SEND' skills/navaris-cash-engine/SKILL.md
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          path = Path("output/NAVARIS_Agnatics_OS_FINAL.xlsx")
          assert path.exists() and path.stat().st_size > 0
          wb = load_workbook(path)
          required = {"Pricing_Grading", "Monthly_30pct", "Tenders_BCG"}
          assert required.issubset(set(wb.sheetnames))
          assert len(wb["Pricing_Grading"]._charts) >= 1
          print("PASS: local NAVARIS workbook and native chart validated.")
          PY

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NAVARIS Cash-First Integrity Run"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Scheduled local target: 00:00 Egypt time (UTC+3)"
            echo "- Scope: local core tests, policy checks, and editable Excel workbook build."
            echo "- This run does not discover live tenders, verify buyers/suppliers, send messages, or submit bids."
            echo "- Actual cash collected remains evidence-based; forecasts are not collected cash."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive validated workbook
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: navaris-cash-first-workbook
          path: output/NAVARIS_Agnatics_OS_FINAL.xlsx
          if-no-files-found: error
          retention-days: 14
