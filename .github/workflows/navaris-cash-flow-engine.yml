name: NAVARIS CASH FLOW ENGINE

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cash-flow-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Excel dependency
        run: pip install openpyxl
      - name: Run NAVARIS cash-first control
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          p = Path("data/NAVARIS_3Part_AgreementFirst_OS.xlsx")
          if not p.exists():
              raise SystemExit("Required NAVARIS workbook is missing")
          wb = load_workbook(p)
          ws = wb["MASTER_3Part_Agreement_First"]
          headers = {c.value:i+1 for i,c in enumerate(ws[1])}
          if "Agreement_Status" in headers:
              col = headers["Agreement_Status"]
              for r in range(2, ws.max_row + 1):
                  if any(ws.cell(r,c).value for c in range(1, ws.max_column + 1)):
                      ws.cell(r,col).value = "AGREEMENT REQUIRED FIRST"
          wb.save(p)
          print(f"NAVARIS CASH FLOW ENGINE verified {ws.max_row-1} opportunity rows.")
          PY
      - name: Validate NAVARIS workbook controls
        run: python scripts/validate_navaris_workbook.py
      - name: Commit engine updates
        run: |
          git config user.name "navaris-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/NAVARIS_3Part_AgreementFirst_OS.xlsx docs/STRATEGY_CASH_FIRST.md skills/navaris-cash-engine/SKILL.md .github/workflows/navaris-cash-flow-engine.yml
          git diff --cached --quiet || git commit -m "NAVARIS CASH FLOW ENGINE scheduled update"
          git push
