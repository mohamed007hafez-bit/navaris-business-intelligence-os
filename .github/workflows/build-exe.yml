name: Build NAVARIS EXE
on:
  push:
    branches: [ai-work]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Compile Python sources
        run: python -m compileall -q main.py dashboard src
      - name: Build Windows desktop executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name navaris-business-intelligence-os
          --collect-all sqlcipher3
          --collect-all customtkinter
          --hidden-import sqlcipher3.dbapi2
          main.py
      - uses: actions/upload-artifact@v5
        with:
          name: navaris-os-exe
          path: dist/navaris-business-intelligence-os.exe
          if-no-files-found: error
