name: NAVARIS Local Hybrid OS — Tests and Workbook

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navaris-local-hybrid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test NAVARIS local engine
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile NAVARIS Python modules
        run: |
          python -m py_compile navaris_core.py scout_agent.py pricer_agent.py ncnda_agent.py cash_agent.py chatgpt_bridge.py main.py suco_quote_workbook.py
          python -m compileall -q tests

      - name: Run NAVARIS regression tests
        run: python -m unittest discover -s tests -p "test_navaris_os.py" -v

      - name: Build demo workbook (illustrative data only)
        run: python main.py --demo --output output/navaris-quote-demo.xlsx

      - name: Build blank AOG quote workbook template
        run: python suco_quote_workbook.py --output output/navaris-quote-suco-aog-500kg.xlsx

      - name: Verify workbook artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          demo = Path("output/navaris-quote-demo.xlsx")
          quote = Path("output/navaris-quote-suco-aog-500kg.xlsx")
          assert demo.exists() and demo.stat().st_size > 0, "Demo workbook missing or empty"
          assert quote.exists() and quote.stat().st_size > 0, "AOG quote template missing or empty"
          wb = load_workbook(demo, read_only=False, data_only=False)
          required = {"Pricing_Grading", "Monthly_30pct", "Tenders_BCG"}
          assert required.issubset(set(wb.sheetnames)), f"Missing demo sheets: {required - set(wb.sheetnames)}"
          assert len(wb["Pricing_Grading"]._charts) >= 1, "Expected native Excel charts"
          qw = load_workbook(quote, data_only=False)
          assert "AOG Quote" in qw.sheetnames
          assert str(qw["AOG Quote"]["B16"].value).startswith("=IF("), "Expected evidence-gated quote formula"
          print("PASS: demo workbook, required sheets and native chart verified.")
          print("PASS: blank AOG quote workbook and formulas verified.")
          print("NOTICE: quote is unpriced until buyer and supplier inputs are evidenced.")
          PY

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NAVARIS Local Hybrid OS"
            echo "- Commit: ${{ github.sha }}"
            echo "- Mode: local-first; no cloud request is sent"
            echo "- Checks: Python compile, regression tests, demo workbook, AOG quote-template build"
            echo "- Cash collected: only actual receipt evidence may be recorded as collected"
            echo "- Demo data are illustrative; AOG price remains blank until evidence is supplied"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive workbooks
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: navaris-quote-workbooks
          path: output/navaris-quote-*.xlsx
          if-no-files-found: error
          retention-days: 14
