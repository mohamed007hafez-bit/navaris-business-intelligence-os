name: NAVARIS Python Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navaris-python-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate NAVARIS Python and workbook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install openpyxl
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Compile Python source files
        run: python -m compileall -q scripts

      - name: Build NAVARIS operating workbook
        run: python scripts/build_agreement_first_os.py

      - name: Validate NAVARIS workbook
        run: python scripts/validate_navaris_workbook.py
