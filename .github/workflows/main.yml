name: Run Python Project

on:
  push:
    branches: [ "main" ] # سيعمل الكود تلقائياً عند دفع أي تعديل لفرع main
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # تتيح لك زر تشغيل يدوي (Run workflow) في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10' # يمكنك تغيير الإصدار حسب مشروعك

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Application
      run: |
        # استبدل main.py باسم ملف التشغيل الرئيسي لمشروعك
        python main.py 
