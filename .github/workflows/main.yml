name: NAVARIS Local Hybrid OS — Tests and Workbook

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navaris-local-hybrid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test NAVARIS local engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile NAVARIS Python modules
        run: |
          python -m py_compile navaris_core.py scout_agent.py pricer_agent.py ncnda_agent.py cash_agent.py chatgpt_bridge.py main.py
          python -m compileall -q tests

      - name: Run NAVARIS regression tests
        run: python -m unittest discover -s tests -p "test_navaris_os.py" -v

      - name: Build demo workbook (illustrative data only)
        run: python main.py --demo --output output/NAVARIS_Agnatics_OS_FINAL.xlsx

      - name: Verify workbook artifact exists
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          path = Path("output/NAVARIS_Agnatics_OS_FINAL.xlsx")
          assert path.exists() and path.stat().st_size > 0, "NAVARIS workbook missing or empty"
          wb = load_workbook(path, read_only=False, data_only=False)
          required = {"Pricing_Grading", "Monthly_30pct", "Tenders_BCG"}
          assert required.issubset(set(wb.sheetnames)), f"Missing sheets: {required - set(wb.sheetnames)}"
          assert len(wb["Pricing_Grading"]._charts) >= 1, "Expected native Excel charts"
          print("PASS: workbook and required sheets exist.")
          print("PASS: native editable Excel chart exists.")
          print("NOTICE: demo figures are illustrative; not live tenders or collected cash.")
          PY

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NAVARIS Local Hybrid OS"
            echo "- Commit: ${{ github.sha }}"
            echo "- Mode: local-first; no cloud request is sent"
            echo "- Checks: Python compile, regression tests, Excel build, native chart validation"
            echo "- Cash collected: only actual receipt evidence may be recorded as collected"
            echo "- Demo input: illustrative, not a verified tender or customer"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive workbook
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: navaris-local-hybrid-workbook
          path: output/NAVARIS_Agnatics_OS_FINAL.xlsx
          if-no-files-found: error
          retention-days: 14
