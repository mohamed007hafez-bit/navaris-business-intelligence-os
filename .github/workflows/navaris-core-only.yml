name: NAVARIS Core Only - Tests and Windows x64 Installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests-and-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run core-only agent tests
        run: python -m pytest -q tests/test_core.py
      - name: Install Electron dependencies
        run: npm install --no-audit --no-fund --fetch-retries=2 --fetch-timeout=120000
      - name: Build Windows x64 installer
        run: npm run dist
      - name: Verify installer exists and report size
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw "Windows installer EXE was not created." }
          $sizeMiB = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "Installer: $($exe.FullName)"
          Write-Host "Size MiB: $sizeMiB"
          if ($sizeMiB -lt 60 -or $sizeMiB -gt 100) { Write-Warning "Installer is outside the expected 70-80 MiB target band." }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: navaris-core-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Package source ZIP
        shell: pwsh
        run: |
          $items = @("agents", "tests/test_core.py", "index.html", "main.js", "package.json", "requirements.txt", "requirements-dev.txt", "README.md")
          Compress-Archive -Path $items -DestinationPath NAVARIS_CORE_ONLY.zip -Force
      - name: Upload core source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: navaris-core-source-zip
          path: NAVARIS_CORE_ONLY.zip
          if-no-files-found: error
          retention-days: 14
