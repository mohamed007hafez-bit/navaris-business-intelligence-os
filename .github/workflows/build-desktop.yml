name: NAVARIS v0.3.0 Windows Desktop Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'index.html'
      - '.github/workflows/build-desktop.yml'
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Package NSIS installer and portable EXE
        working-directory: desktop
        run: npm run dist:win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NAVARIS-v0.3.0-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
